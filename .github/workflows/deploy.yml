name: Deploy to Hostinger KVM2

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: |
          siamClient/package-lock.json
          siamServer/package-lock.json
    
    - name: Install client dependencies
      working-directory: ./siamClient
      run: npm install --legacy-peer-deps
      
    - name: Build client
      working-directory: ./siamClient
      run: CI=false npm run build
      
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        
    - name: Add server to known hosts
      run: |
        ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
        
    - name: Deploy to server
      run: |
        # Copy server files to existing directory
        rsync -avz --delete \
          --exclude 'node_modules' \
          --exclude '.git' \
          --exclude 'images' \
          ./siamServer/ root@${{ secrets.SERVER_IP }}:/home/ubuntu/siamsuits/siamServer/
          
        # Copy built client files
        rsync -avz --delete \
          ./siamClient/build/ root@${{ secrets.SERVER_IP }}:/home/ubuntu/siamsuits/siamClient/build/
          
        # Copy images and other assets if needed
        rsync -avz \
          ./images/ root@${{ secrets.SERVER_IP }}:/home/ubuntu/siamsuits/images/
          
        rsync -avz \
          ./siamServer/images/ root@${{ secrets.SERVER_IP }}:/home/ubuntu/siamsuits/siamServer/images/
          
        rsync -avz \
          ./siamServer/ImagesFabric/ root@${{ secrets.SERVER_IP }}:/home/ubuntu/siamsuits/siamServer/ImagesFabric/
          
        # Install dependencies and restart PM2
        ssh root@${{ secrets.SERVER_IP }} << 'EOF'
          cd /home/ubuntu/siamsuits/siamServer
          npm install --production
          
          # Kill and restart PM2 process
          pm2 kill
          pm2 start server.js
          
          # Save PM2 configuration
          pm2 save
        EOF 